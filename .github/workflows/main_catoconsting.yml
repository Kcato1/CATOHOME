# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy JAR app to Azure Web App - Catoconsting

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout
    outputs:
      maven-project: ${{ steps.detect.outputs.maven-project }}

    steps:
      - uses: actions/checkout@v4

      - name: Check for Maven project
        id: detect
        shell: pwsh
        run: |
          if (Test-Path -Path 'pom.xml' -PathType Leaf) {
            "maven-project=true" >> $env:GITHUB_OUTPUT
          } else {
            "maven-project=false" >> $env:GITHUB_OUTPUT
            Write-Host "Skipping build: no pom.xml exists at the repository root."
          }

      - name: Set up Java version
        if: steps.detect.outputs.maven-project == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'microsoft'

      - name: Build with Maven
        if: steps.detect.outputs.maven-project == 'true'
        run: mvn clean install

      - name: Upload artifact for deployment job
        if: steps.detect.outputs.maven-project == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: '${{ github.workspace }}/target/*.jar'

  deploy:
    runs-on: windows-latest
    needs: build
    if: needs.build.outputs.maven-project == 'true'
    
    
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: java-app
      
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'Catoconsting'
          slot-name: 'Production'
          package: '*.jar'

          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_2294C70C1BD64F72AAF4A8ED0F6CAEF6 }}
